name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 语法与用例收集检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 语法检查（compileall）
        run: python -m compileall -q *.py api

      - name: 用例收集检查（不发起真实请求，无需被测服务）
        run: pytest --collect-only -q
